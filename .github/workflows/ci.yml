name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history: the eval gate checks a result is newer than the code it scored.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download NLTK stopwords
        # The German stopword list is data, not part of the pip package.
        run: python -m nltk.downloader stopwords

      - name: Lint
        run: ruff check .

      - name: Test
        # Skips tests marked @pytest.mark.db — no Postgres runs in CI yet.
        run: pytest -m "not db"

      - name: Eval gate
        # Checks the committed eval results; needs no database and calls no API.
        run: python -m support_reply_gap.eval --gate