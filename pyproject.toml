[project]
name = "support-reply-gap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-play-scraper",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100