[project]
name = "support-reply-gap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-play-scraper",
    "pandas",
    "psycopg[binary]",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "lingua-language-detector",
    "scikit-learn",
    "nltk",
    "matplotlib",
    "iterative-stratification",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
notebook = ["ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = ["db: requires a running Postgres"]

[tool.setuptools.package-data]
"support_reply_gap" = ["**/*.sql"]